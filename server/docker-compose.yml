services:
  db:
    image: postgres:15-alpine
    container_name: leasewise-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lozinka
      POSTGRES_DB: leasewise
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: leasewise-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: lozinka
    ports:
      - '5050:80'
    depends_on:
      - db

volumes:
  postgres_data:
